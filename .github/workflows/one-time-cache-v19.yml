name: One-time app cache bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bump app cache to v19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump app cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'app.js?v=17' not in text:
              raise SystemExit('Expected app.js?v=17 marker not found')
          path.write_text(text.replace('app.js?v=17', 'app.js?v=19'), encoding='utf-8')
          Path('.github/workflows/one-time-cache-v19.yml').unlink()
          PY
      - name: Commit cache bump
        run: |
          git config user.name "SSML automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-cache-v19.yml
          git commit -m "Bump app cache version to v19"
          git push origin HEAD:main
