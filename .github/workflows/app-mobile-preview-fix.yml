name: Fix song deletion preview cleanup

on:
  push:
    paths:
      - '.github/workflows/app-mobile-preview-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deletion cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          text = app_path.read_text(encoding='utf-8')

          old = '''async function handleDeleteSong(){const song=state.activeSong;if(!song||!confirm(`Slette «${song.title}» og alle PDF-filene? Dette kan ikkje angrast.`))return;const button=$("#delete-song");button.disabled=true;button.textContent="Slettar …";try{if(state.demo){const stored=loadLocalSongs().filter(item=>item.id!==song.id);localStorage.setItem("ssml-demo-songs",JSON.stringify(stored));}else await deleteSong(song);state.songs=state.songs.filter(item=>item.id!==song.id);clearPreviewPdfCache();state.activeSong=null;state.activePart=null;renderAll();showView("archive");toast(`«${song.title}» er sletta.`);}catch(error){console.error(error);button.disabled=false;button.textContent="Slett sang";toast("Kunne ikkje slette songen og PDF-filene.","error");}}'''
          new = '''async function handleDeleteSong(){const song=state.activeSong;if(!song||!confirm(`Slette «${song.title}» og alle PDF-filene? Dette kan ikkje angrast.`))return;const button=$("#delete-song");button.disabled=true;button.textContent="Slettar …";try{state.previewVersion++;clearPreviewPdfCache();if(state.demo){const stored=loadLocalSongs().filter(item=>item.id!==song.id);localStorage.setItem("ssml-demo-songs",JSON.stringify(stored));}else await deleteSong(song);state.songs=state.songs.filter(item=>item.id!==song.id);state.activeSong=null;state.activePart=null;renderAll();showView("archive");toast(`«${song.title}» er sletta.`);}catch(error){console.error(error);button.disabled=false;button.textContent="Slett sang";toast("Kunne ikkje slette songen og PDF-filene.","error");}}'''

          if old not in text:
              raise SystemExit('handleDeleteSong anchor not found')
          text = text.replace(old, new, 1)
          app_path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          if 'app.js?v=24' in index:
              index = index.replace('app.js?v=24', 'app.js?v=25', 1)
          elif 'app.js?v=23' in index:
              index = index.replace('app.js?v=23', 'app.js?v=25', 1)
          index_path.write_text(index, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Stop PDF preview before deleting song" || exit 0
          git push
