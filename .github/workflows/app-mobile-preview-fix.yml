name: Clean share button label

on:
  push:
    paths:
      - '.github/workflows/app-mobile-preview-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale share counter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          share_path = Path('share-links.js')
          text = share_path.read_text(encoding='utf-8')
          old = 'const label = `↗ Del noter (${count})`;'
          new = 'const label = "↗ Del noter";'
          if old not in text:
              raise SystemExit('share button label anchor not found')
          text = text.replace(old, new, 1)
          share_path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          match = re.search(r'share-links\.js\?v=(\d+)', index)
          if match:
              version = int(match.group(1)) + 1
              index = index[:match.start(1)] + str(version) + index[match.end(1):]
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-links.js index.html
          git commit -m "Simplify share button label" || exit 0
          git push
