name: Patch mobile PDF preview memory

on:
  push:
    paths:
      - '.github/workflows/mobile-preview-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile preview memory usage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()

          old = '''function cachePreviewPdf(sourceUrl,pdf){
  if(previewPdfCache.has(sourceUrl))previewPdfCache.delete(sourceUrl);
  previewPdfCache.set(sourceUrl,pdf);
  const limit=isMobilePreview()?3:8;'''
          new = '''function cachePreviewPdf(sourceUrl,pdf){
  if(previewPdfCache.has(sourceUrl))previewPdfCache.delete(sourceUrl);
  previewPdfCache.set(sourceUrl,pdf);
  const limit=isMobilePreview()?1:8;'''
          if old not in s:
              raise SystemExit('cache snippet not found')
          s = s.replace(old, new, 1)

          old = '''async function getPreviewPdf(part){
  const sourceUrl=partSourceUrl(part);
  if(!sourceUrl)return null;
  if(previewPdfCache.has(sourceUrl)){
    const cached=previewPdfCache.get(sourceUrl);
    previewPdfCache.delete(sourceUrl);previewPdfCache.set(sourceUrl,cached);
    return cached;
  }
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument(sourceUrl).promise;
  cachePreviewPdf(sourceUrl,pdf);
  return pdf;
}'''
          new = '''async function getPreviewPdf(part,version=null){
  const sourceUrl=partSourceUrl(part);
  if(!sourceUrl)return null;
  if(previewPdfCache.has(sourceUrl)){
    const cached=previewPdfCache.get(sourceUrl);
    previewPdfCache.delete(sourceUrl);previewPdfCache.set(sourceUrl,cached);
    return cached;
  }
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument(sourceUrl).promise;
  if(version!==null&&version!==state.previewVersion){releasePdf(pdf);return null;}
  cachePreviewPdf(sourceUrl,pdf);
  return pdf;
}'''
          if old not in s:
              raise SystemExit('getPreviewPdf snippet not found')
          s = s.replace(old, new, 1)

          old = '''  if(parts.length===0){$("#preview-title").textContent="Førehandsvising";$("#thumbnail-grid").innerHTML='<p class="loading-pages">Kryss av éi eller fleire stemmer for å sjå dei her.</p>';return;}
  if(parts.length===1){state.activePart=parts[0];renderPartList();await loadPreview(parts[0],version);return;}
  const grid=$("#thumbnail-grid");'''
          new = '''  if(parts.length===0){$("#preview-title").textContent="Førehandsvising";$("#thumbnail-grid").innerHTML='<p class="loading-pages">Kryss av éi eller fleire stemmer for å sjå dei her.</p>';return;}
  if(parts.length===1){state.activePart=parts[0];renderPartList();await loadPreview(parts[0],version);return;}
  if(isMobilePreview()){
    clearPreviewPdfCache();
    const grid=$("#thumbnail-grid");
    grid.className="multi-preview";
    grid.innerHTML=`<p class="loading-pages"><strong>${parts.length} stemmer valde.</strong><br>Førehandsvising av fleire PDF-ar er slått av på mobil for å spare minne. Du kan framleis sende, skrive ut eller opne éi stemme om gongen.</p>`;
    $("#preview-title").textContent=`${parts.length} valde stemmer`;
    return;
  }
  const grid=$("#thumbnail-grid");'''
          if old not in s:
              raise SystemExit('renderSelectedPreview insertion point not found')
          s = s.replace(old, new, 1)

          s = s.replace('const pdf=await getPreviewPdf(part);\n      if(version!==state.previewVersion)return;', 'const pdf=await getPreviewPdf(part,version);\n      if(version!==state.previewVersion)return;', 1)
          s = s.replace('try{state.pdfDoc=await getPreviewPdf(part);if(version!==state.previewVersion)return;', 'try{state.pdfDoc=await getPreviewPdf(part,version);if(version!==state.previewVersion)return;', 1)

          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if 'src="app.js?v=23"' not in s:
              raise SystemExit('app cache version not found')
          s = s.replace('src="app.js?v=23"', 'src="app.js?v=24"', 1)
          p.write_text(s)
          PY

          git config user.name "SSML Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Reduce mobile PDF preview memory"
          git push
