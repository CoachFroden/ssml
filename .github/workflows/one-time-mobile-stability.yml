name: One-time mobile stability fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run mobile stability fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Improve mobile stability and filename-first sorting
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          text = text.replace('from "./firebase.js?v=19";', 'from "./firebase.js?v=21";', 1)

          old_cache = 'const previewPdfCache = new Map();'
          new_cache = '''const previewPdfCache = new Map();
const MAX_PREVIEW_PDFS = 2;
function isMobilePreview(){return window.matchMedia?.("(max-width: 850px)")?.matches ?? window.innerWidth<=850;}
function releasePdf(pdf){try{const result=pdf?.destroy?.();result?.catch?.(()=>{});}catch{}}
function clearPreviewPdfCache(){for(const pdf of previewPdfCache.values())releasePdf(pdf);previewPdfCache.clear();state.pdfDoc=null;}
function cachePreviewPdf(sourceUrl,pdf){
  if(previewPdfCache.has(sourceUrl))previewPdfCache.delete(sourceUrl);
  previewPdfCache.set(sourceUrl,pdf);
  while(previewPdfCache.size>MAX_PREVIEW_PDFS){
    const [oldUrl,oldPdf]=previewPdfCache.entries().next().value;
    previewPdfCache.delete(oldUrl);releasePdf(oldPdf);
  }
}'''
          if old_cache not in text:
              raise SystemExit('preview cache marker not found')
          text = text.replace(old_cache, new_cache, 1)

          old_order = '''function partOrderValue(part){
  const name=`${part.name||""} ${part.fileName||""}`.toLowerCase().replace(/\\.pdf$/i,"");
  const match=SSML_PART_ORDER.find(item=>item.pattern.test(name));
  const rank=match?.rank??999;
  const voice=Number(name.match(/\\b([1-9])\\b/)?.[1]||0);
  return rank*100+voice;
}'''
          new_order = '''function partOrderValue(part){
  const fileName=(part.fileName||"").toLowerCase().replace(/\\.pdf$/i,"");
  const displayName=(part.name||"").toLowerCase();
  // Filnamnet er den mest stabile kjelda: AI-namnet kan vere omsett eller feil.
  const fileMatch=SSML_PART_ORDER.find(item=>item.pattern.test(fileName));
  const nameMatch=SSML_PART_ORDER.find(item=>item.pattern.test(displayName));
  const match=fileMatch||nameMatch;
  const rank=match?.rank??999;
  const voiceSource=fileMatch?fileName:`${displayName} ${fileName}`;
  const voice=Number(voiceSource.match(/\\b([1-9])\\b/)?.[1]||0);
  return rank*100+voice;
}'''
          if old_order not in text:
              raise SystemExit('partOrderValue block not found')
          text = text.replace(old_order, new_order, 1)

          old_show = 'function showView(name){ $$(".view").forEach(view=>view.classList.add("hidden"));'
          new_show = 'function showView(name){ if(name!=="song"&&state.activeSong)clearPreviewPdfCache(); $$(".view").forEach(view=>view.classList.add("hidden"));'
          if old_show not in text:
              raise SystemExit('showView marker not found')
          text = text.replace(old_show, new_show, 1)

          old_open = 'function openSong(id){ const song=state.songs.find(x=>x.id===id);if(!song)return;song.parts=sortParts(song.parts||[]);state.activeSong=song;'
          new_open = 'function openSong(id){ const song=state.songs.find(x=>x.id===id);if(!song)return;if(state.activeSong?.id!==id)clearPreviewPdfCache();song.parts=sortParts(song.parts||[]);state.activeSong=song;'
          if old_open not in text:
              raise SystemExit('openSong marker not found')
          text = text.replace(old_open, new_open, 1)

          old_get = '''async function getPreviewPdf(part){
  const sourceUrl=partSourceUrl(part);
  if(!sourceUrl)return null;
  if(previewPdfCache.has(sourceUrl))return previewPdfCache.get(sourceUrl);
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument(sourceUrl).promise;
  previewPdfCache.set(sourceUrl,pdf);
  return pdf;
}'''
          new_get = '''async function getPreviewPdf(part){
  const sourceUrl=partSourceUrl(part);
  if(!sourceUrl)return null;
  if(previewPdfCache.has(sourceUrl)){
    const cached=previewPdfCache.get(sourceUrl);
    previewPdfCache.delete(sourceUrl);previewPdfCache.set(sourceUrl,cached);
    return cached;
  }
  const pdfjs=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  const pdf=await pdfjs.getDocument(sourceUrl).promise;
  cachePreviewPdf(sourceUrl,pdf);
  return pdf;
}'''
          if old_get not in text:
              raise SystemExit('getPreviewPdf block not found')
          text = text.replace(old_get, new_get, 1)

          old_multi_pages = 'const pages=part.pageNumbers?.length?part.pageNumbers:Array.from({length:pdf?.numPages||part.pageCount||1},(_,i)=>i+1);\n      totalPages+=pages.length;'
          new_multi_pages = 'const pages=part.pageNumbers?.length?part.pageNumbers:Array.from({length:pdf?.numPages||part.pageCount||1},(_,i)=>i+1);\n      const previewPages=isMobilePreview()?pages.slice(0,1):pages;\n      totalPages+=pages.length;'
          if old_multi_pages not in text:
              raise SystemExit('multi preview pages marker not found')
          text = text.replace(old_multi_pages, new_multi_pages, 1)
          text = text.replace('for(const pageNo of pages){\n          const page=await pdf.getPage(pageNo);\n          const viewport=page.getViewport({scale:.36});', 'for(const pageNo of previewPages){\n          const page=await pdf.getPage(pageNo);\n          const viewport=page.getViewport({scale:isMobilePreview()?.24:.36});', 1)

          old_load = 'const viewport=page.getViewport({scale:.45});const canvas=document.createElement("canvas");'
          new_load = 'const viewport=page.getViewport({scale:isMobilePreview()?.28:.45});const canvas=document.createElement("canvas");'
          if old_load not in text:
              raise SystemExit('single preview scale marker not found')
          text = text.replace(old_load, new_load, 1)

          old_large = 'const scale=Math.min(2.2,Math.max(1.1,(stage.clientHeight-30)/page.getViewport({scale:1}).height));'
          new_large = 'const maxScale=isMobilePreview()?1.35:2.2;const minScale=isMobilePreview()?.8:1.1;const scale=Math.min(maxScale,Math.max(minScale,(stage.clientHeight-30)/page.getViewport({scale:1}).height));'
          if old_large not in text:
              raise SystemExit('large preview scale marker not found')
          text = text.replace(old_large, new_large, 1)

          app.write_text(text, encoding='utf-8')

          firebase = Path('firebase.js')
          ftext = firebase.read_text(encoding='utf-8')
          old_new_prompt = 'Analyser berre for identifikasjon, ikkje kvalitet. Finn songtittel, komponist, arrangør og instrument/stemme frå dei første sidene. Returner éi instrumentstemme i parts dersom det er mogleg. Bruk norsk instrumentnamn når det er naturleg. Set fileName nøyaktig til ${file.name}.'
          new_new_prompt = 'Analyser berre for identifikasjon, ikkje kvalitet. Finn songtittel, komponist, arrangør og instrument/stemme frå dei første sidene. Filnamnet «${file.name}» er eit sterkt hint om instrument og stemme og skal brukast aktivt; dersom filnamnet tydeleg seier til dømes String Bass, Trombone 2 eller Clarinet 1, skal dette prioriterast med mindre notasida tydeleg viser noko anna. Returner nøyaktig éi instrumentstemme i parts. Bruk norsk instrumentnamn når det er naturleg. Set fileName nøyaktig til ${file.name}.'
          if old_new_prompt not in ftext:
              raise SystemExit('new instrument prompt marker not found')
          ftext = ftext.replace(old_new_prompt, new_new_prompt, 1)

          old_song_prompt = 'Skil mellom til dømes Fløyte 1 og Fløyte 2. Bruk norsk instrumentnamn når det er naturleg. Set fileName til nøyaktig dette kjeldefilnamnet: ${file.name}.'
          new_song_prompt = 'Skil mellom til dømes Fløyte 1 og Fløyte 2. Bruk filnamnet «${file.name}» aktivt som eit sterkt hint om instrument og stemmenummer. For importtypen «Éi PDF per stemme» skal ei kjeldefil berre bli éi stemme, sjølv om teksten kan tolkast med fleire namn eller språk. Bruk norsk instrumentnamn når det er naturleg. Set fileName til nøyaktig dette kjeldefilnamnet: ${file.name}.'
          if old_song_prompt not in ftext:
              raise SystemExit('song analysis prompt marker not found')
          ftext = ftext.replace(old_song_prompt, new_song_prompt, 1)
          firebase.write_text(ftext, encoding='utf-8')

          index = Path('index.html')
          itext = index.read_text(encoding='utf-8')
          import re
          itext = re.sub(r'app\\.js\\?v=\\d+', 'app.js?v=21', itext, count=1)
          index.write_text(itext, encoding='utf-8')

          Path('.github/workflows/one-time-mobile-stability.yml').unlink()
          trigger = Path('.trigger-mobile-stability-fix')
          if trigger.exists(): trigger.unlink()
          PY
      - name: Validate JavaScript
        run: |
          node --check firebase.js
          node --check app.js
      - name: Commit change
        run: |
          git config user.name "SSML automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Improve mobile stability and filename sorting"
          git push origin HEAD:main
