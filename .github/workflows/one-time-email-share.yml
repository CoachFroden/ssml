name: One-time email share

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PDF email sharing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text()

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected app.js marker: {label}')
              return text.replace(old, new, 1)

          app = must_replace(app, 'const previewPdfCache = new Map();', 'const previewPdfCache = new Map();\nlet preparedEmailFiles = [];', 'email state')
          app = must_replace(app, '  $("#ai-review-form").addEventListener("submit",confirmAnalysis);\n  window.addEventListener("pagehide",()=>clearPreviewPdfCache());', '  $("#ai-review-form").addEventListener("submit",confirmAnalysis);\n  $("#share-email-now").addEventListener("click",sharePreparedEmailFiles);\n  window.addEventListener("pagehide",()=>clearPreviewPdfCache());', 'share button binding')
          app = must_replace(app, '<div class="part-selection-tools"><button id="select-all-parts" class="text-btn" type="button">Velg alle</button><button id="print-selected-parts" class="btn btn-primary" type="button">Skriv ut valgte</button></div>', '<div class="part-selection-tools"><button id="select-all-parts" class="text-btn" type="button">Velg alle</button><button id="print-selected-parts" class="btn btn-primary" type="button">Skriv ut valgte</button><button id="email-selected-parts" class="btn btn-light" type="button">✉ Send på e-post</button></div>', 'email button')
          app = must_replace(app, '$("#select-all-parts").addEventListener("click",toggleAllParts);$("#print-selected-parts").addEventListener("click",printSelectedParts);$("#delete-song")', '$("#select-all-parts").addEventListener("click",toggleAllParts);$("#print-selected-parts").addEventListener("click",printSelectedParts);$("#email-selected-parts").addEventListener("click",prepareEmailShare);$("#delete-song")', 'email button event')
          old_tools = 'function updatePartSelectionTools(){const all=state.activeSong?.parts||[];const count=state.selectedPartIds.size;const button=$("#select-all-parts");if(button)button.textContent=all.length&&count===all.length?"Fjern alle":"Velg alle";const printButton=$("#print-selected-parts");if(printButton){printButton.disabled=count===0;printButton.textContent=`Skriv ut valgte (${count})`;}const mainPrint=$("#open-print");if(mainPrint)mainPrint.textContent=count>1?`Skriv ut valgte (${count})`:"⌁ Skriv ut stemma";}'
          new_tools = 'function updatePartSelectionTools(){const all=state.activeSong?.parts||[];const count=state.selectedPartIds.size;const button=$("#select-all-parts");if(button)button.textContent=all.length&&count===all.length?"Fjern alle":"Velg alle";const printButton=$("#print-selected-parts");if(printButton){printButton.disabled=count===0;printButton.textContent=`Skriv ut valgte (${count})`;}const emailButton=$("#email-selected-parts");if(emailButton){emailButton.disabled=count===0;emailButton.textContent=`✉ Send på e-post (${count})`;}const mainPrint=$("#open-print");if(mainPrint)mainPrint.textContent=count>1?`Skriv ut valgte (${count})`:"⌁ Skriv ut stemma";}'
          app = must_replace(app, old_tools, new_tools, 'selection tools')

          share_code = r'''
function safeSharePdfName(part){
  const song=(state.activeSong?.title||"Notar").trim();
  const voice=(part?.name||"Stemme").trim();
  return `${song} - ${voice}.pdf`.replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
}

async function buildEmailShareFiles(parts){
  const allParts=state.activeSong?.parts||[];
  const sourceCounts=new Map();
  for(const part of allParts){const url=partSourceUrl(part);if(url)sourceCounts.set(url,(sourceCounts.get(url)||0)+1);}
  const sourceCache=new Map();
  const getSource=async url=>{if(sourceCache.has(url))return sourceCache.get(url);const response=await fetch(url);if(!response.ok)throw new Error("Kunne ikkje hente ei av PDF-filene.");const blob=await response.blob();const entry={blob,doc:null};sourceCache.set(url,entry);return entry;};
  const files=[];
  for(const part of parts){
    const url=partSourceUrl(part);if(!url)throw new Error(`«${part.name}» manglar PDF-fil.`);
    const entry=await getSource(url);const filename=safeSharePdfName(part);const sourceIsShared=(sourceCounts.get(url)||0)>1;
    if(!sourceIsShared){files.push(new File([entry.blob],filename,{type:"application/pdf"}));continue;}
    const {PDFDocument}=await import("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm");
    if(!entry.doc)entry.doc=await PDFDocument.load(await entry.blob.arrayBuffer());
    const pageNumbers=part.pageNumbers?.length?part.pageNumbers:Array.from({length:entry.doc.getPageCount()},(_,i)=>i+1);
    const validPages=pageNumbers.filter(number=>Number.isInteger(number)&&number>=1&&number<=entry.doc.getPageCount());
    if(!validPages.length)throw new Error(`Ingen gyldige sider funne for «${part.name}».`);
    const output=await PDFDocument.create();const copied=await output.copyPages(entry.doc,validPages.map(number=>number-1));copied.forEach(page=>output.addPage(page));
    files.push(new File([await output.save({useObjectStreams:true})],filename,{type:"application/pdf"}));
  }
  return files;
}

async function prepareEmailShare(){
  const parts=selectedParts();if(!parts.length){toast("Vel minst éi stemme.","error");return;}if(!navigator.share){toast("Denne nettlesaren støttar ikkje sending av PDF-vedlegg direkte.","error");return;}
  const button=$("#email-selected-parts");button.disabled=true;button.textContent="Klargjer PDF-ar …";
  try{preparedEmailFiles=await buildEmailShareFiles(parts);if(navigator.canShare&&!navigator.canShare({files:preparedEmailFiles}))throw new Error("Nettlesaren kan ikkje dele desse PDF-filene som vedlegg.");const totalMb=preparedEmailFiles.reduce((sum,file)=>sum+file.size,0)/1048576;$("#email-share-summary").textContent=`${preparedEmailFiles.length} PDF-fil(er), ${totalMb.toFixed(1)} MB. Trykk Del PDF-ar og vel Mail i delingsmenyen.`;const list=$("#email-share-files");list.innerHTML="";preparedEmailFiles.forEach(file=>{const row=document.createElement("div");row.className="file-row";row.innerHTML=`<div><strong>▧ ${escapeHtml(file.name)}</strong><small>${(file.size/1048576).toFixed(1)} MB</small></div>`;list.append(row);});$("#email-share-dialog").showModal();}catch(error){console.error(error);preparedEmailFiles=[];toast(error.message||"Kunne ikkje klargjere PDF-ane for e-post.","error");}finally{updatePartSelectionTools();}
}

async function sharePreparedEmailFiles(){
  if(!preparedEmailFiles.length){toast("Ingen PDF-filer er klargjorde.","error");return;}
  try{if(navigator.canShare&&!navigator.canShare({files:preparedEmailFiles}))throw new Error("Nettlesaren kan ikkje dele desse PDF-filene som vedlegg.");await navigator.share({files:preparedEmailFiles});$("#email-share-dialog").close();preparedEmailFiles=[];toast("PDF-ane blei delte til vald app.");}catch(error){if(error?.name==="AbortError")return;console.error(error);toast(error.message||"Kunne ikkje opne delingsmenyen.","error");}
}

'''
          marker = 'async function printSelectedParts(){'
          if marker not in app: raise SystemExit('Missing printSelectedParts marker')
          app = app.replace(marker, share_code + marker, 1)
          app_path.write_text(app)

          index_path=Path('index.html');index=index_path.read_text()
          modal='''\n  <dialog id="email-share-dialog" class="modal small-modal">\n    <div><header><div><p class="eyebrow green">Del notar</p><h2>Send på e-post</h2></div><button class="icon-btn" type="button" data-close-dialog aria-label="Lukk">×</button></header><p id="email-share-summary" class="muted">Klargjer PDF-filer …</p><div id="email-share-files" class="file-list"></div><aside class="info-note"><span>i</span><p><strong>På iPhone/iPad:</strong><br>Trykk «Del PDF-ar» og vel <strong>Mail</strong>. PDF-filene blir lagde ved som vedlegg.</p></aside><footer><button class="btn btn-ghost" type="button" data-close-dialog>Avbryt</button><button id="share-email-now" class="btn btn-primary" type="button">Del PDF-ar</button></footer></div>\n  </dialog>\n\n'''
          page_marker='  <dialog id="page-dialog" class="page-modal">'
          if page_marker not in index: raise SystemExit('Missing page dialog marker')
          index=index.replace(page_marker,modal+page_marker,1).replace('selection.css?v=10','selection.css?v=11').replace('app.js?v=23','app.js?v=24')
          index_path.write_text(index)

          css_path=Path('selection.css');css=css_path.read_text();css+='''\n#email-selected-parts { grid-column: 2; }\n\n@media (max-width: 520px) {\n  #email-selected-parts { grid-column: auto; }\n}\n''';css_path.write_text(css)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html selection.css
          git diff --cached --quiet && exit 0
          git commit -m "Add email sharing for selected PDF parts"
          git push
