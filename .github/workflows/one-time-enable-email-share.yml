name: One-time enable email sharing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Enable email sharing module'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable email sharing module
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script type="module" src="app.js?v=23"></script>'
          new = old + '\n  <script type="module" src="email-share.js?v=1"></script>'
          if old not in text:
              raise SystemExit('Expected app.js script tag was not found; no changes made.')
          if 'email-share.js?v=1' not in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-time-enable-email-share.yml').unlink()
          PY
      - name: Commit change
        run: |
          git config user.name "SSML automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-enable-email-share.yml
          git commit -m "Enable email sharing button"
          git push origin HEAD:main
