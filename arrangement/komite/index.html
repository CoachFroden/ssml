<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komitéportal · SSML</title><style>:root{font-family:system-ui,sans-serif;color:#123d5c;background:#e5f2f6}body{margin:0;padding:20px}main{max-width:680px;margin:30px auto}section,article{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #1234}input,textarea,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bad3dd}input,textarea{max-width:100%;box-sizing:border-box}button{background:#125b82;color:white;cursor:pointer}button:disabled{opacity:.5}form{display:grid;gap:12px}.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd}.task input{width:22px;height:22px}#status{color:#a33}[hidden]{display:none!important}</style><style>

/* SSML komité · roleg, levande visuell profil */
:root{--deep:#173d57;--sea:#227e83;--gold:#d8b67b}
body{position:relative;isolation:isolate;overflow-x:hidden;background:linear-gradient(135deg,#eaf2f5 0%,#f5f8f7 48%,#e8f1f1 100%)!important}
body::before{content:"";position:fixed;z-index:-1;pointer-events:none;inset:-18%;background:radial-gradient(circle at 16% 20%,rgba(66,155,165,.17),transparent 26%),radial-gradient(circle at 86% 13%,rgba(212,181,125,.20),transparent 22%),radial-gradient(circle at 70% 83%,rgba(90,151,176,.14),transparent 30%);animation:ambient-drift 22s ease-in-out infinite alternate}
body::after{content:"♪";position:fixed;right:5%;top:12%;font-family:Georgia,serif;font-size:clamp(130px,22vw,300px);line-height:1;color:#1c7081;opacity:.065;pointer-events:none;z-index:-1;transform:rotate(-13deg);animation:note-float 12s ease-in-out infinite}
@keyframes ambient-drift{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(2%,1%,0) scale(1.06)}}
@keyframes note-float{50%{transform:translateY(-18px) rotate(-9deg)}}
main{max-width:790px;margin:14px auto 48px}
#portal{display:grid;gap:10px}
#portal[hidden]{display:none!important}
#portal>section,#gate{margin:0!important;border-radius:16px!important;padding:15px 19px!important;box-shadow:0 5px 20px #173e5412!important;border:1px solid #dce7e9!important;background:#ffffffee!important}
#portal>section:first-child{position:relative;overflow:hidden;background:linear-gradient(112deg,#163f5c,#176d79)!important;border-color:#ffffff38!important;color:white!important;padding:20px 22px!important}
#portal>section:first-child::after{content:"♫";position:absolute;right:105px;top:-42px;font-family:Georgia,serif;font-size:150px;color:#fff;opacity:.07;transform:rotate(-15deg);pointer-events:none}
#portal>section:first-child h1{font-size:clamp(22px,3vw,29px);margin:4px 0;position:relative;z-index:1}
#portal>section:first-child #date{font-size:13px;margin:4px 0;color:#d2e9ec}
#logout{position:relative;z-index:2;padding:8px 12px;font-size:12px}
#portal h2{font-size:17px!important;margin:0 0 9px!important;letter-spacing:-.02em}
#task-summary{margin:0 0 9px;font-size:12px}
#tasks{display:grid;gap:5px}
#tasks .task{padding:8px 11px;margin:0;border-radius:9px;min-height:40px;font-size:13px}
#tasks .task input{width:18px;height:18px}
#members p{padding:8px 11px;font-size:13px}
#add-task{margin-top:11px;padding:10px;gap:7px}
#add-task input,#add-task button{padding:9px 10px;font-size:13px}
#portal #messages{gap:7px;margin:10px 0 12px}
#portal #messages article{padding:9px 13px;max-width:85%;font-size:13px}
#portal #messages article p{margin-top:5px}
#send{padding:11px;gap:7px}
#send input,#send textarea,#recipient{padding:9px 10px;font-size:13px}
#send textarea{min-height:66px}
#send button{padding:10px;font-size:13px}
.message-tabs{margin:8px 0}.message-tabs button{padding:9px;font-size:12px}
#gate{max-width:430px;margin:12vh auto!important;padding:26px!important}
#gate h1{font-size:27px;margin:0 0 8px;color:#163f5b}
#gate:before{content:"♫  SAMNANGER SKULEMUSIKKLAG";display:block;font-size:10px;letter-spacing:.15em;font-weight:800;color:#2a858b;margin-bottom:15px}
button{transition:transform .18s,box-shadow .18s,filter .18s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
@media(max-width:650px){body{padding:10px!important}main{margin:4px auto 30px}#portal{gap:8px}#portal>section{padding:13px!important}#portal>section:first-child{padding:17px!important}#portal #messages article{max-width:92%}body::after{right:-35px;top:25%;font-size:180px}#add-task{grid-template-columns:1fr 1fr}#add-task input:first-child{grid-column:1/-1}#add-task button{grid-column:2}#add-task input:nth-child(2){grid-column:1}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}button{transition:none}}
</style></head><body><main><section id="gate"><h1>Komitéportal</h1><p>Logg inn med passordet frå styret.</p><form id="login"><input id="password" type="password" autocomplete="off" required placeholder="Komitépassord"><button id="enter">Logg inn</button></form><p id="status" aria-live="polite"></p></section><div id="portal" hidden><section><button id="logout" type="button">Logg ut</button><h1 id="title">Komitéportal</h1><p id="date"></p></section><section><h2>Oppgåver</h2><div id="task-summary"></div><div id="tasks"></div><form id="add-task"><input id="task-author" maxlength="100" required placeholder="Namnet ditt"><input id="task-text" maxlength="500" required placeholder="Nytt gjøremål"><button type="submit">+ Legg til oppgåve</button></form></section><section><h2>Komité</h2><div id="members"></div></section><section><h2>Meldingar</h2><div class="message-tabs"><button type="button" class="selected" data-channel="board">Til styret</button><button type="button" data-channel="committee">Internt i komiteen</button></div><div id="messages"></div><form id="send"><label for="recipient">Send til</label><select id="recipient"><option value="board">Styret</option><option value="committee">Berre komiteen</option></select><input id="sender" required maxlength="100" placeholder="Namnet ditt"><textarea id="message" required maxlength="2000" placeholder="Skriv melding"></textarea><button>Send melding</button></form></section></div></main><script type="module" src="../committee.js"></script></body></html>
