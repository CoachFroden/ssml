<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Komitéportal · SSML</title><style>:root{font-family:system-ui,sans-serif;color:#123d5c;background:#e5f2f6}body{margin:0;padding:20px}main{max-width:680px;margin:30px auto}section,article{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #1234}input,textarea,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bad3dd}input,textarea{max-width:100%;box-sizing:border-box}button{background:#125b82;color:white;cursor:pointer}button:disabled{opacity:.5}form{display:grid;gap:12px}.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd}.task input{width:22px;height:22px}#status{color:#a33}[hidden]{display:none!important}</style><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19334c;background:#edf4f7}
body{background:radial-gradient(circle at 90% 0%,#d5edf1,transparent 36%),linear-gradient(145deg,#f2f7fa,#e7f0f5);min-height:100vh;padding:14px}
main{max-width:820px;margin:15px auto 60px}
section{border:1px solid #e1eaf0;border-radius:20px;padding:20px 23px;margin:12px 0;box-shadow:0 12px 35px #193b5614;background:#fff}
section h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.04em;margin:8px 0}section h2{font-size:20px;letter-spacing:-.025em;margin:0 0 14px}
#portal>section:first-child{background:linear-gradient(120deg,#103e60,#116d78);color:white}#portal>section:first-child #date{color:#cde8ef}#logout{float:right;background:#ffffff22;border-color:#ffffff55}
button{background:linear-gradient(135deg,#0c8b8d,#17557e);border:0;color:white;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #1155752a}button:hover{filter:brightness(1.07)}
input,textarea{border:1px solid #ccdde6;background:#fbfdff}textarea{min-height:85px;width:100%}#sender{width:100%}
.task{border:1px solid #dce8ee;border-left:4px solid #13968d;border-radius:11px;margin:7px 0;padding:11px 12px;background:#fbfefe}.task:has(input:checked){border-left-color:#aac9c4;background:#f1f7f5;color:#6b8285}.task:has(input:checked) span{text-decoration:line-through}.task input{accent-color:#0d8c80;flex-shrink:0}
#task-summary{font-size:13px;color:#5b7985;margin-bottom:10px;font-weight:700}
#members p{padding:10px 12px;background:#f4f8fa;border-radius:10px;margin:7px 0}
#messages{display:flex;flex-direction:column;gap:9px;margin:12px 0 20px}
#messages article{width:fit-content;max-width:88%;margin:0;padding:12px 15px;box-shadow:none;border-radius:15px;border:1px solid #d9e7ec}
#messages article.from-board{align-self:flex-start;background:#dceefb;border-color:#b9d7ef;border-bottom-left-radius:4px}
#messages article.from-committee{align-self:flex-end;background:#e1f4e8;border-color:#bde3cb;border-bottom-right-radius:4px}
#messages article p{margin:8px 0 0;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
#messages article small{color:#557382;font-size:11px}#messages article .source{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;opacity:.7;margin-left:7px}
@media(max-width:600px){body{padding:8px}main{margin:5px auto}section{padding:15px;border-radius:16px}#messages article{max-width:94%}}
</style></head><body><main><section id="gate"><h1>Komitéportal</h1><p>Logg inn med passordet frå styret.</p><form id="login"><input id="password" type="password" autocomplete="off" required placeholder="Komitépassord"><button id="enter">Logg inn</button></form><p id="status" aria-live="polite"></p></section><div id="portal" hidden><section><button id="logout" type="button">Logg ut</button><h1 id="title">Komitéportal</h1><p id="date"></p></section><section><h2>Oppgåver</h2><div id="task-summary"></div><div id="tasks"></div></section><section><h2>Komité</h2><div id="members"></div></section><section><h2>Meldingar</h2><div id="messages"></div><form id="send"><input id="sender" required maxlength="100" placeholder="Namnet ditt"><textarea id="message" required maxlength="2000" placeholder="Skriv melding"></textarea><button>Send melding</button></form></section></div></main><script type="module" src="../committee.js"></script></body></html>
