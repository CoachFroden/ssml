<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sommarkonsert · SSML</title><style>:root{font-family:system-ui,sans-serif;color:#123d5c;background:#e5f2f6}body{margin:0;padding:20px}main{max-width:680px;margin:30px auto}section,article{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #1234}input,textarea,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #bad3dd}input,textarea{max-width:100%;box-sizing:border-box}button{background:#125b82;color:white;cursor:pointer}button:disabled{opacity:.5}form{display:grid;gap:12px}.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd}.task input{width:22px;height:22px}#status{color:#a33}[hidden]{display:none!important}</style></head><body data-slot="a2"><main><section id="gate"><h1>Sommarkonsert</h1><p>Logg inn med passordet frå styret.</p><form id="login"><input id="password" type="password" autocomplete="off" required placeholder="Komitépassord"><button id="enter">Logg inn</button></form><p id="status" aria-live="polite"></p></section><div id="portal" hidden><section><button id="logout" type="button">Logg ut</button><h1 id="title">Sommarkonsert</h1><p id="date"></p></section><section><h2>Oppgåver</h2><div id="tasks"></div></section><section><h2>Komité</h2><div id="members"></div></section><section><h2>Meldingar</h2><div id="messages"></div><form id="send"><input id="sender" required maxlength="100" placeholder="Namnet ditt"><textarea id="message" required maxlength="2000" placeholder="Skriv melding"></textarea><button>Send melding</button></form></section></div></main><script type="module" src="../committee.js"></script></body></html>
